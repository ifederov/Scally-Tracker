services:
  - type: web
    name: scally-tracker
    runtime: python
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SHOPIFY_URL
        sync: false
      - key: NTFY_TOPIC
        sync: false
      - key: CRON_SECRET
        sync: false
